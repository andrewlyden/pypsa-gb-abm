[project]
name = "ukabm"
version = "0.1.0"
description = "Agent-based model of the GB electricity market linked to PyPSA-GB, with multi-energy hooks"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "mesa>=3", "pypsa>=0.30", "highspy"]

[project.optional-dependencies]
raw = ["pyproj", "openpyxl"]   # only needed to rebuild the PyPSA-GB snapshot
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["ukabm*"]

[tool.setuptools.package-data]
"ukabm.data" = ["*.toml"]

[tool.pytest.ini_options]
markers = ["slow: long runs, skipped unless UKABM_SLOW=1"]
